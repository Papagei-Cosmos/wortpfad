name: Publish isolated function test
on:
  push:
    branches: [main]
    paths: ['test-bundle/**', '.github/workflows/publish-test.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: publish-wortpfad-test
  cancel-in-progress: false
jobs:
  prepare-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack the approved test site
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib,tarfile
          repo=pathlib.Path.cwd()
          release=json.loads((repo/'test-bundle/release.json').read_text())
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'wortpfad-test.tar.gz'
          digest=hashlib.sha256()
          with archive.open('wb') as output:
              for part in release['parts']:
                  path=repo/part['path']
                  if path.parent != repo/'test-bundle' or path.stat().st_size != part['size']: raise RuntimeError('Invalid bundle part')
                  with path.open('rb') as source:
                      for block in iter(lambda:source.read(1048576),b''): output.write(block);digest.update(block)
          if archive.stat().st_size!=release['archiveSize'] or digest.hexdigest()!=release['archiveSHA256']: raise RuntimeError('Bundle checksum mismatch')
          with tarfile.open(archive,'r:gz') as bundle:
              for member in bundle.getmembers():
                  if not (member.name=='test' or member.name.startswith('test/')) or member.issym() or member.islnk(): raise RuntimeError('Unexpected bundle path')
              bundle.extractall(repo,filter='data')
          print('Verified standalone test site:',release['version'])
          PY
      - name: Publish test files while preserving the existing portal
        run: |
          git fetch origin main
          test "$(git rev-parse FETCH_HEAD)" = "${{ github.sha }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add test
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified standalone function test at /test/'
            git push origin HEAD:main
          fi
      - name: Request the existing branch-based Pages build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json,os,urllib.request
          url='https://api.github.com/repos/'+os.environ['GH_REPO']+'/pages/builds'
          request=urllib.request.Request(url,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},data=b'{}')
          with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
          print('Pages build requested:',result['id'])
          PY
